aid: journey-clinical
name: Journey Clinical
description: >-
  Journey Clinical is a telehealth platform for ketamine-assisted psychotherapy (KAP). It
  pairs licensed medical prescribers who manage patient eligibility, prescribing, and clinical
  monitoring with a member network of independent licensed psychotherapists who deliver the
  preparation, dosing, and integration therapy sessions. Alongside KAP the company offers
  standalone medication management and Spravato (esketamine) treatment, operates across 25+ US
  states, and accepts major insurance plans as well as HSA/FSA payment. Journey Clinical is a
  HIPAA-covered telehealth provider (publishing a Notice of Privacy Practices) and, as surfaced
  through the API Evangelist network, does not currently publish a public developer API,
  OpenAPI specification, SDKs, or developer portal. This profile captures its public identity,
  compliance posture, and domain security as a company record.
